<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- AskLocker's mark, the question lock (4 November 2026): an open
       padlock whose shackle bends into a question mark, the keyhole its
       dot. White on nothing: the icon's navy is the tile behind it (this
       file's icon.json fill, the PNGs' background), and the keyhole is a
       real hole, so the one-colour icons (Android's monochrome layer, the
       notification badge) keep it. Every PNG is rendered from this file:
       node scripts/render-icons.mjs -->
  <!-- the shackle, a question mark -->
  <path d="M362 408V372c0-90 66-152 150-152s150 58 150 140c0 70-44 102-96 128-34 17-54 40-54 82"
        fill="none" stroke="#FFFFFF" stroke-width="88" stroke-linecap="round"/>
  <!-- the body, with the keyhole cut out -->
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M348 556H676A76 76 0 0 1 752 632V780A76 76 0 0 1 676 856H348A76 76 0 0 1 272 780V632A76 76 0 0 1 348 556Z M489.1 716A46 46 0 1 1 534.9 716L544 766c2 11-6 20-17 20h-30c-11 0-19-9-17-20Z"/>
</svg>

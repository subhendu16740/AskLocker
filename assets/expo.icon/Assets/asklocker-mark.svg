<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- AskLocker's mark, the question lock (4 November 2026): an open
       padlock whose shackle bends into a question mark, the keyhole its
       dot. White on nothing: the icon's navy is the tile behind it (this
       file's icon.json fill, the PNGs' background), and the keyhole is a
       real hole, so the one-colour icons (Android's monochrome layer, the
       notification badge) keep it.

       Drawn on a grid, so it stays sharp on a screen at 1x: every straight
       edge is on a multiple of 32 (the lock's on multiples of 64), so at
       16, 32, 48 and 64 px each one falls exactly on a pixel instead of
       between two, and the shackle is 3 px wide at 32 px. Keep it so when
       changing a shape. Every PNG is rendered from this file:
       node scripts/render-icons.mjs -->
  <!-- the shackle, a question mark: 96 wide, its outer edges at x 320 and
       704, its top at y 192 -->
  <path d="M368 416V384A144 144 0 0 1 656 384C656 448 612 474 572 492C532 510 512 512 512 520"
        fill="none" stroke="#FFFFFF" stroke-width="96" stroke-linecap="round"/>
  <!-- the body, x 256-768, y 512-832, with the keyhole cut out -->
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M320 512H704A64 64 0 0 1 768 576V768A64 64 0 0 1 704 832H320A64 64 0 0 1 256 768V576A64 64 0 0 1 320 512Z M480 695.4A64 64 0 1 1 544 695.4V752A16 16 0 0 1 528 768H496A16 16 0 0 1 480 752Z"/>
</svg>
